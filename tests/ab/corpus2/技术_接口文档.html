<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>患者主索引服务接口文档</title></head><body><h1>患者主索引服务 API v2</h1><p>基础地址：https://api.example-hospital.cn/pmi/v2</p><h2>一、鉴权</h2><p>使用 Bearer Token，有效期 2 小时，过期后需重新获取。</p><h2>二、重试策略</h2><p>客户端在网络错误时最多自动重试 3 次，间隔按指数退避，首次 200 毫秒。</p><h2>三、限流</h2><p>单租户限流 100 rps，超出返回 429，同时返回 Retry-After 头。</p><h2>四、超时</h2><p>服务端超时 30 秒，客户端建议设置为 35 秒以留出重试余量。</p><h2>五、错误码</h2><table border="1"><tr><th>错误码</th><th>含义</th></tr><tr><td>40001</td><td>缺少必填参数</td></tr><tr><td>40901</td><td>患者已存在</td></tr><tr><td>50301</td><td>下游 HIS 不可用</td></tr></table></body></html>
