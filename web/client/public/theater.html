<script id="director-core">
/* Pure event adapter and virtual clock; no model calls, DOM or external libraries. */
(()=>{
 const STAGES=[['inbox','接收文件','核对收到的材料'],['search','查找资料','先找相关内容，再核对'],['evidence','核对原文','看看原文到底怎么说'],['draft','拟定修改','先提建议，文件还没改'],['approval','你来确认','看清改动，再决定是否保存'],['delivery','领取结果','核对答复，下载实际文件']];
 const terminal=s=>['completed','failed','cancelled','interrupted'].includes(s);
 const label=s=>({queued:'等待开始',running:'正在处理',awaiting_approval:'等待你确认',completed:'处理结束',failed:'这次未完成',cancelled:'已停止',interrupted:'已中断'}[s]||s);
 function bubblePlacement(anchor,width,height,vw,vh){
  const margin=8,gap=12;if(anchor.x<0||anchor.x>vw||anchor.y<0||anchor.y>vh)return{visible:false};
  const below=anchor.y-height-gap<margin&&anchor.footY+gap+height<=vh-margin,x=below?(anchor.footX??anchor.x):anchor.x;
  const left=Math.max(margin,Math.min(vw-width-margin,x-width/2)),top=below?anchor.footY+gap:Math.max(margin,anchor.y-height-gap);
  return{visible:true,left,top,tailX:Math.max(9,Math.min(width-9,x-left)),below};
 }
 function reconcileSelection(selected,known,documents,initialized){return new Set(documents.filter(d=>d.status==='ready'&&(!initialized||selected.has(d.id)||!known.has(d.id))).map(d=>d.id));}
 const stateAt=(events,arm)=>events.findLast(e=>e.arm===arm&&e.armStatus)?.armStatus||(events.some(e=>e.arm===arm)?'running':'queued');
 const timing=(a,now=Date.now())=>{const human=(a.confirmationMs||0)+(a.awaitingSince?Math.max(0,now-Date.parse(a.awaitingSince)):0);return {human,execution:a.startedAt?Math.max(0,(a.endedAt?Date.parse(a.endedAt):now)-Date.parse(a.startedAt)-human):0};};
 const STAFF=['inbox','search','evidence','draft','approval','delivery'];
 const ROOMS={
  search:{x:85,y:130,w:500,h:330,floor:0,name:'查找资料',door:[335,475]},
  evidence:{x:650,y:130,w:500,h:330,floor:0,name:'核对原文',door:[900,475]},
  draft:{x:1215,y:130,w:500,h:330,floor:0,name:'拟定修改',door:[1465,475]},
  inbox:{x:65,y:675,w:390,h:335,floor:1,name:'接收文件',door:[260,1025]},
  rest:{x:510,y:675,w:410,h:335,floor:1,name:'休息待命',door:[715,1025]},
  approval:{x:1015,y:675,w:335,h:335,floor:1,name:'你来确认',door:[1182,1025]},
  delivery:{x:1400,y:675,w:335,h:335,floor:1,name:'领取结果',door:[1567,1025]}
 };
 const WORLD=[0,0,1800,1140],HALL=[535,1080],STAIR=970;
 function seat(index){return{x:590+(index%3)*120,y:index<3?835:970,room:'rest'};}
 function desk(room,index=0){const r=ROOMS[room];return{x:r.x+r.w*.5+(index%3-1)*82,y:r.y+r.h-37-Math.floor(index/3)*65,room};}
 function route(from,to){
  if(from.room===to.room&&from.room!=='hall')return[{x:to.x,y:to.y,room:to.room}];
  const a=ROOMS[from.room],b=ROOMS[to.room],af=a?a.floor:(from.y<650?0:1),bf=b?b.floor:(to.y<650?0:1),points=[];
  if(a)points.push({x:a.door[0],y:a.door[1],room:'hall'},{x:a.door[0],y:HALL[af],room:'hall'});
  if(af!==bf)points.push({x:STAIR,y:HALL[af],room:'hall'},{x:STAIR,y:HALL[bf],room:'hall'});
  if(b)points.push({x:b.door[0],y:HALL[bf],room:'hall'},{x:b.door[0],y:b.door[1],room:'hall'});
  points.push({x:to.x,y:to.y,room:to.room});return points;
 }
 function workBeats(beats){
  const pools=Object.fromEntries(['native','folio'].map(a=>[a,{next:0,busy:Array(6).fill(null),queue:[],jobs:new Map(),review:null}]));
  for(const b of beats){const e=b.event,p=pools[b.arm];b.work=null;b.promotions=[];b.releases=[];
   const copy=u=>({id:u.id,worker:u.worker,stage:u.stage,kind:u.kind,name:u.name,start:u.start,end:u.end});
   function acquire(u){for(let n=0;n<6;n++){const w=(p.next+n)%6;if(!p.busy[w]){u.worker=w;p.busy[w]=u.id;p.next=(w+1)%6;return true;}}p.queue.push(u);return false;}
   function start(id,kind,stage=e.stage,name=''){let u=p.jobs.get(id);if(!u){u={id,kind,stage,name,start:e,worker:null};p.jobs.set(id,u);acquire(u);}b.work=copy(u);return u;}
   function finish(u){u.end=e;b.work=copy(u);if(u.worker===null)return;if(p.busy[u.worker]===u.id)p.busy[u.worker]=null;
    while(p.queue.length){const next=p.queue.shift();acquire(next);b.promotions.push(copy(next));if(!next.end)break;p.busy[next.worker]=null;}
   }
   const prefix=b.arm+'/';
   if(e.type==='tool_start'){start(prefix+'tool/'+(e.toolCallId||e.seq),'tool');b.mode='start';}
   else if(e.type==='tool_end'){const key=prefix+'tool/'+(e.toolCallId||e.seq),u=p.jobs.get(key)||start(key,'tool');finish(u);b.mode='finish';}
   else if(e.type==='index'){start(prefix+'index/'+e.seq,'index','inbox',(e.message||'').replace(/^建立索引[:：]\s*/,''));b.mode='start';}
   else if(e.type==='indexed'){const u=[...p.jobs.values()].find(u=>u.kind==='index'&&!u.end&&(e.message||'').startsWith(u.name))||[...p.jobs.values()].find(u=>u.kind==='index'&&!u.end)||start(prefix+'index/'+e.seq,'index','inbox');finish(u);b.mode='finish';}
   else if(e.type==='settled'&&(e.armStatus==='awaiting_approval'||e.stage==='approval'&&e.state==='waiting')){p.review??=prefix+'review/'+e.seq;start(p.review,'review','approval');b.mode='hold';}
   else if(['apply_start','applied','apply_end'].includes(e.type)){p.review??=prefix+'review/'+e.seq;start(p.review,'review','approval');b.mode='review';}
   else if(e.type==='failed'||e.armStatus==='cancelled'||e.armStatus==='interrupted'){
    b.releases=[...p.jobs.values()].filter(u=>!u.end&&u.worker!==null).map(copy);for(const u of p.jobs.values())u.end??=e;p.busy.fill(null);p.queue=[];p.review=null;b.mode='stop';
   }else if(e.type==='prepared'||e.type==='native_write'||e.type==='settled'){
    if(p.review){const u=p.jobs.get(p.review);if(u&&!u.end){b.releases.push(copy(u));u.end=e;if(u.worker!==null)p.busy[u.worker]=null;}p.review=null;}
    const u=start(prefix+e.type+'/'+e.seq,e.type,e.stage);finish(u);b.mode='atomic';
   }else b.mode='status';
  }return beats;
 }

 function compileEvents(events){return workBeats(events.filter(e=>e.stage&&['prepared','index','indexed','starting','tool_start','tool_end','notice','native_write','apply_start','applied','apply_end','settled','failed'].includes(e.type)).map(e=>({id:e.seq,event:e,stage:e.stage,arm:e.arm})));}
 function short(value,max=16){const chars=Array.from(typeof value==='string'?value.replace(/\s+/g,' ').trim():'');return chars.length>max?chars.slice(0,max-1).join('')+'…':chars.join('');}
 function locationLabel(value){const s=typeof value==='string'?value:'',m=s.match(/^(p\.|¶)(\d+)(?::L(\d+))?$/);return m?'第'+m[2]+(m[1]==='p.'?'页':'段')+(m[3]?'第'+m[3]+'行':''):short(s,20);}
 function describe(e,start,changes){
  const tool=(e.tool||start?.tool||'').replace('mcp__folio__',''),args={...start?.args,...e.args},who=e.arm==='native'?'不用 Folio':'使用 Folio';
  const query=short(args.query,10),file=short(typeof(args.doc??args.path)==='string'?(args.doc??args.path).split(/[\\/]/).at(-1):'',12),place=locationLabel(args.target||e.references?.[0]?.label),where=place||'指定位置';
  const operation=tool==='folio_search'?'search':tool==='folio_page'||tool==='read'?'read':tool==='folio_revise'?'propose':tool==='edit'||tool==='write'?'edit':tool==='folio_list'?'list':tool==='folio_outline'?'outline':tool==='folio_revisions'?'proposals':e.stage;
  const steps={
   search:[query?'找一下“'+query+'”。':'按条件查找相关资料。',query?'按关键词“'+query+'”找相关段落，找到后还要核对原文。':'按条件查找相关资料，拿到内容后还要核对。'],
   read:[place?'查看'+where+'的原文。':file?'读一下“'+file+'”。':'查看文件里的原文。',place?'查看'+where+'的原文，核对相关内容。':file?'读取“'+file+'”的内容，核对相关信息。':'读取文件内容，核对相关信息。'],
   propose:[args.action==='delete'?'拟好删除建议，先不要改。':'先拟好修改建议，不改文件。','先准备修改建议；文件还没改，需要你确认后再保存。'],
   edit:['直接修改这次的文件副本。','直接修改本次文件副本，完成后还要核对文件是否变化。'],
   list:['先看看收到哪些文件。','查看收到的文件，确定有哪些材料可以使用。'],
   outline:['看看文件的内容目录。','查看内容目录，帮助确定接下来到哪里查找。'],
   proposals:['核对已有的修改建议。','查看已有修改建议及其状态。'],
   inbox:['先核对收到的文件。','核对本次收到的文件，为后续处理做准备。'],
   evidence:['查看与任务相关的原文。','查看相关内容，核对是否能支持答复。'],
   draft:['处理这一步的修改工作。','进行已记录的修改操作，随后核对文件或建议。'],
   approval:['核对这一步的处理状态。','核对当前处理状态，是否保存以实际文件为准。'],
   delivery:['把处理结果送回来。','整理这次的处理结果，接下来核对实际文件。']
  };
  let [dispatch,purpose]=steps[operation]||['处理当前这一步。','按记录处理当前这一步，详细操作可以点开查看。'];
  let text=dispatch,item='文件',action='status',emotion='normal',stampText='文件有变化';
  if(e.type==='prepared'){text='文件收到了，先核对材料。';dispatch='先核对收到的文件。';purpose='两边接收相同版本的文件，处理的是各自的副本。';action='receive';}
  else if(e.type==='index'){text=dispatch='先整理文字，方便查找。';purpose='整理文件里的文字和位置，方便后面查找原文。';action='index';}
  else if(e.type==='indexed'){const empty=e.state==='waiting';text=empty?'这份文件没有可读取的文字。':'文字和位置整理好了，可以查找。';purpose=empty?'没有可读取的文字，这份材料暂时不能用于查找。':'文件里的文字和位置已整理好，接下来可以查找相关内容。';action='indexDone';emotion=empty?'sweat':'happy';}
  else if(e.type==='starting'){text=dispatch='接到要求，准备开始。';purpose='正在启动处理程序，还没有开始查找资料。';action='receive';}
  else if(e.type==='tool_start'){action=e.arm==='folio'?'request':'operate';item=operation==='propose'?'修改单':'任务单';}
  else if(e.type==='tool_end'){
   action=e.arm==='folio'?'return':'collect';item=operation==='propose'?'修改单':e.references?.length?'证据':'结果';
   const noHits=tool==='folio_search'&&/^no hits for /i.test(e.detail||''),incomplete=tool==='folio_search'&&/^incomplete search; no matches observed/i.test(e.detail||'');
   if(noHits||incomplete){text=incomplete?'查找未完成，暂时没看到匹配。':'这次没有匹配的内容。';purpose=incomplete?'这次查找没有完成，目前没有看到匹配内容，不能判断材料里一定没有。':'这次查找没有匹配内容；是否继续，以后续真实操作为准。';item='结果';emotion='sweat';}
   else if(operation==='propose'){text='修改建议备好了，文件还没改。';purpose='修改建议已经准备好，需要你查看前后差异并确认。';emotion='happy';}
   else if(e.references?.length){text=place?'拿到'+place+'相关内容，核对一下。':query?'拿到“'+query+'”相关内容。':'拿到相关内容，核对原文。';purpose=(query?'按“'+query+'”查找，':'')+'已拿到'+(place?place+'的':'')+'相关内容；还要核对是否回答了问题。';emotion='happy';}
   else if(operation==='edit'){text='操作已返回，还要核对文件。';purpose='修改操作已返回；文件是否真的变化，以后续文件核对为准。';}
   else{text=operation==='list'?'收到文件清单，继续核对。':operation==='read'?'读取结果回来了，核对一下。':operation==='search'?'查找结果回来了，核对一下。':'这一步已返回，查看实际结果。';purpose=operation==='read'&&file?'“'+file+'”的读取结果已返回，继续核对内容。':'这一步已返回结果，'+({list:'继续核对有哪些材料。',read:'继续核对读取的内容。',search:'继续核对查找的内容。'}[operation]||'详细内容可以点开查看。');}
  }else if(e.type==='native_write'){
   const addedOnly=changes?.some(c=>c.status==='added')&&changes.every(c=>['unchanged','added'].includes(c.status)),edited=changes?.some(c=>['modified','deleted'].includes(c.status));
   text=addedOnly?'生成了新文件，原有文件没改。':edited?'核对过了，文件副本有改动。':'记录了文件变化，请查看对照。';dispatch='核对文件的实际变化。';purpose=addedOnly?'已核对：这一边新增了文件，原有文件内容没有改变。':edited?'已核对：这一边修改或移除了文件副本，可查看实际变化。':'记录提示存在文件变化；具体是新增、修改还是移除，请查看实际文件。';stampText=addedOnly?'新增文件':edited?'副本有改动':'文件有变化';action='nativeWrite';emotion='happy';}
  else if(e.type==='apply_start'){text='你已确认，现在保存修改。';purpose='收到你的确认，正在把选中的修改建议保存到本次副本。';action='apply';item='修改单';}
  else if(e.type==='applied'){const done=e.state==='done';text=done?'修改保存成功，可以盖章了！':'修改没有保存成功，先别盖章。';purpose=done?'选中的修改已实际保存，可以核对文件并下载。':'修改没有保存成功，请查看原因。';action=done?'stamp':'error';emotion=done?'happy':'shock';}
  else if(e.type==='apply_end'){text=e.state==='error'?'文件版本变了，需要重新核对。':'这次确认已处理，核对文件。';purpose=e.state==='error'?'原文版本发生变化，需要重新核对后再保存。':'本次确认已处理，实际保存结果以文件核对为准。';}
  else if(e.type==='settled'){
