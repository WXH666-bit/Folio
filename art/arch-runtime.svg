<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a5b"/></marker>
    <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a5651a"/></marker>
    <style>
      .bx{fill:#fff;stroke:#cfc8b4}
      .bxc{fill:#efead9;stroke:#b9ad86}
      .t{font-size:12.5px;fill:#1f1f1c;font-weight:700}
      .d{font-size:10.5px;fill:#7d776a}
      .m{font-size:9.5px;fill:#8b8471;letter-spacing:.1em}
      .e{font-size:10px;fill:#6f6a5b}
      .eb{font-size:10px;fill:#a5651a}
    </style>
  </defs>

  <!-- 客户端边界 -->
  <rect x="16" y="52" width="250" height="150" fill="none" stroke="#8b8471" stroke-dasharray="5 4"/>
  <text x="16" y="44" class="m">进程边界 · 宿主</text>
  <rect class="bx" x="34" y="76" width="214" height="50"/>
  <text x="46" y="98" class="t">Agent 循环</text>
  <text x="46" y="114" class="d">pi / DSH / Claude Code</text>
  <rect class="bx" x="34" y="140" width="214" height="44"/>
  <text x="46" y="160" class="t">MCP 客户端</text>
  <text x="46" y="175" class="d">stdio 传输</text>

  <!-- 连接 -->
  <path d="M156 190 V236 H300 V104 H340" fill="none" stroke="#6f6a5b" stroke-width="1.3" marker-end="url(#r1)"/>
  <text x="120" y="254" class="e">JSON-RPC · stdio · tools/call</text>

  <!-- 服务进程边界 -->
  <rect x="322" y="52" width="470" height="330" fill="none" stroke="#1f1f1c" stroke-dasharray="6 4"/>
  <text x="322" y="44" class="m">进程边界 · Folio MCP 服务（node dist/cli.js serve）</text>

  <rect class="bx" x="340" y="72" width="434" height="52"/>
  <text x="352" y="94" class="t">工具层 · mcp.ts</text>
  <text x="352" y="111" class="d">folio_list / search / page / outline / revise / revisions / apply</text>

  <rect class="bx" x="340" y="140" width="208" height="52"/>
  <text x="352" y="162" class="t">查询层</text>
  <text x="352" y="179" class="d">search.ts · format.ts</text>

  <rect class="bx" x="566" y="140" width="208" height="52"/>
  <text x="578" y="162" class="t">读取层</text>
  <text x="578" y="179" class="d">store.ts（manifest / index）</text>

  <rect class="bx" x="340" y="208" width="208" height="52"/>
  <text x="352" y="230" class="t">写入层</text>
  <text x="352" y="247" class="d">revisions.ts · write-docx.ts</text>

  <rect x="566" y="208" width="208" height="52" fill="#fbf8ef" stroke="#a5651a" stroke-width="1.4"/>
  <text x="578" y="230" class="t" fill="#a5651a">写权限闸门</text>
  <text x="578" y="247" class="d">未带 --allow-apply 则拒绝</text>

  <rect class="bxc" x="340" y="276" width="434" height="34"/>
  <text x="352" y="298" class="d">lock.ts · 跨进程互斥（20s 过期 / 10s 等待）</text>

  <path d="M444 124 V140" stroke="#6f6a5b" stroke-width="1.1" marker-end="url(#r1)"/>
  <path d="M670 124 V140" stroke="#6f6a5b" stroke-width="1.1" marker-end="url(#r1)"/>
  <path d="M444 192 V208" stroke="#6f6a5b" stroke-width="1.1" marker-end="url(#r1)"/>
  <path d="M774 140 V208" stroke="#6f6a5b" stroke-width="1.1" marker-end="url(#r1)"/>

  <!-- 整理员进程 -->
  <rect x="322" y="404" width="250" height="86" fill="#f7f3e6" stroke="#1f1f1c" stroke-width="1.4"/>
  <text x="322" y="396" class="m">进程边界 · 整理员（folio watch）</text>
  <text x="338" y="430" class="t">watch.ts + indexer.ts</text>
  <text x="338" y="448" class="d">chokidar 监听 · 增量解析</text>
  <text x="338" y="464" class="d">串行化，避免并发写 manifest</text>
  <text x="338" y="480" class="d">可与服务进程分开部署</text>

  <!-- 文件系统边界 -->
  <rect x="16" y="516" width="1008" height="108" fill="none" stroke="#8b8471" stroke-dasharray="5 4"/>
  <text x="16" y="508" class="m">文件系统 · 唯一共享点</text>

  <rect class="bx" x="34" y="536" width="176" height="72"/>
  <text x="46" y="558" class="t">源文件夹</text>
  <text x="46" y="574" class="d">原件 · 只读承诺</text>
  <text x="46" y="590" class="d">PDF 永不写回</text>

  <rect class="bx" x="228" y="536" width="176" height="72"/>
  <text x="240" y="558" class="t">.folio/manifest.json</text>
  <text x="240" y="574" class="d">文档元数据</text>
  <text x="240" y="590" class="d">tmp + rename 原子写</text>

  <rect class="bx" x="422" y="536" width="176" height="72"/>
  <text x="434" y="558" class="t">.folio/index/*.txt</text>
  <text x="434" y="574" class="d">每行 = 页码 + 原文</text>
  <text x="434" y="590" class="d">可删可重建</text>

  <rect class="bx" x="616" y="536" width="176" height="72"/>
  <text x="628" y="558" class="t">revisions/*.jsonl</text>
  <text x="628" y="574" class="d">修改申请单</text>
  <text x="628" y="590" class="d">只追加，last-wins</text>

  <rect class="bx" x="810" y="536" width="196" height="72"/>
  <text x="822" y="558" class="t">backup/ · lock</text>
  <text x="822" y="574" class="d">写前留底 / 互斥文件</text>
  <text x="822" y="590" class="d">从不覆盖</text>

  <!-- 服务进程 → 文件 -->
  <path d="M900 224 V516" fill="none" stroke="#6f6a5b" stroke-width="1.2" marker-end="url(#r1)" stroke-dasharray="0"/>
  <text x="906" y="300" class="e" transform="rotate(90 906 300)">fs read / write</text>

  <!-- 整理员 → 文件 -->
  <path d="M446 490 V536" fill="none" stroke="#6f6a5b" stroke-width="1.2" marker-end="url(#r1)"/>
  <text x="454" y="512" class="e">解析结果落盘</text>
  <path d="M122 536 V490 H322" fill="none" stroke="#a5651a" stroke-width="1.2" marker-end="url(#r2)" stroke-dasharray="4 3"/>
  <text x="130" y="482" class="eb">fs 事件</text>
</svg>
