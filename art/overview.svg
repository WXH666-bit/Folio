<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8471"/>
    </marker>
    <style>
      .lab{font-size:13px;fill:#2b2b28}
      .sub{font-size:11px;fill:#8b8471}
      .name{font-size:14px;font-weight:700;fill:#1f1f1c}
      .mono{font-size:10px;fill:#8b8471;letter-spacing:.1em}
    </style>
  </defs>
  <rect width="980" height="410" fill="none"/>

  <!-- 1 文件夹 -->
  <g transform="translate(20,60)">
    <rect x="0" y="0" width="150" height="180" rx="2" fill="#efead9" stroke="#d6d1c2"/>
    <path d="M6 18 h9 a4 4 0 0 1 3 2 l2 4 h20 v-6 a4 4 0 0 0-4-4 H14 a8 8 0 0 0-8 8 z" fill="#c9be9b" stroke="#b9ad86"/>
    <path d="M0 26 h150 v154 a2 2 0 0 1-2 2 H2 a2 2 0 0 1-2-2 z" fill="#f7f3e6" stroke="#d6d1c2"/>
    <g transform="translate(14,44)">
      <rect x="0" y="26" width="86" height="106" rx="1" fill="#fff" stroke="#cfc8b4"/>
      <rect x="10" y="12" width="86" height="106" rx="1" fill="#fffdf7" stroke="#cfc8b4"/>
      <rect x="20" y="0" width="86" height="106" rx="1" fill="#fff" stroke="#b9ad86"/>
      <rect x="47" y="0" width="22" height="18" fill="#efe7d2" stroke="none"/>
      <path d="M47 18 L69 0" stroke="#b9ad86" stroke-width="1"/>
      <rect x="29" y="26" width="56" height="3" fill="#c9be9b"/>
      <rect x="29" y="35" width="62" height="3" fill="#c9be9b"/>
      <rect x="29" y="44" width="40" height="3" fill="#c9be9b"/>
      <text x="29" y="70" class="mono" letter-spacing=".16em">PDF</text>
      <rect x="29" y="78" width="56" height="3" fill="#ded7c3"/>
      <rect x="29" y="87" width="48" height="3" fill="#ded7c3"/>
    </g>
    <text x="0" y="200" class="name">你的文件夹</text>
    <text x="0" y="218" class="sub">原文件一直原样放着</text>
  </g>

  <path d="M182 150 H222" stroke="#8b8471" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 2 整理员 -->
  <g transform="translate(232,86)">
    <circle cx="46" cy="46" r="44" fill="#f7f3e6" stroke="#8b8471" stroke-dasharray="4 4"/>
    <circle cx="46" cy="34" r="12" fill="none" stroke="#2b2b28" stroke-width="2"/>
    <path d="M26 72 a20 20 0 0 1 40 0" fill="none" stroke="#2b2b28" stroke-width="2"/>
    <g stroke="#a5651a" stroke-width="1.6" fill="none">
      <path d="M70 74 l6 6 M76 74 l-6 6"/>
    </g>
    <text x="46" y="112" class="name" text-anchor="middle">整理员</text>
    <text x="46" y="130" class="sub" text-anchor="middle">一直待命的程序</text>
  </g>

  <path d="M330 150 H370" stroke="#8b8471" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 3 卡片盒 -->
  <g transform="translate(380,58)">
    <rect x="0" y="0" width="190" height="188" rx="3" fill="#f7f3e6" stroke="#1f1f1c" stroke-width="2"/>
    <g transform="translate(16,18)">
      <rect x="0" y="0" width="120" height="42" fill="#fff" stroke="#cfc8b4"/>
      <rect x="6" y="8" width="14" height="9" fill="#e3dcc6"/>
      <rect x="26" y="9" width="86" height="3" fill="#cfc8b4"/>
      <rect x="26" y="17" width="66" height="3" fill="#e3dcc6"/>
      <rect x="6" y="28" width="106" height="3" fill="#e3dcc6"/>
    </g>
    <g transform="translate(10,70)">
      <rect x="0" y="0" width="120" height="42" fill="#fff" stroke="#cfc8b4"/>
      <rect x="6" y="8" width="14" height="9" fill="#e3dcc6"/>
      <rect x="26" y="9" width="80" height="3" fill="#cfc8b4"/>
      <rect x="26" y="17" width="70" height="3" fill="#e3dcc6"/>
      <rect x="6" y="28" width="100" height="3" fill="#e3dcc6"/>
    </g>
    <g transform="translate(14,122)">
      <rect x="0" y="0" width="120" height="42" fill="#fff" stroke="#cfc8b4"/>
      <rect x="6" y="8" width="14" height="9" fill="#e3dcc6"/>
      <rect x="26" y="9" width="74" height="3" fill="#cfc8b4"/>
      <rect x="26" y="17" width="60" height="3" fill="#e3dcc6"/>
      <rect x="6" y="28" width="94" height="3" fill="#e3dcc6"/>
    </g>
    <g transform="translate(140,30)">
      <rect x="0" y="0" width="34" height="120" rx="2" fill="#efead9" stroke="#b9ad86"/>
      <text x="17" y="-8" class="mono" text-anchor="middle" letter-spacing=".12em">.folio</text>
    </g>
    <text x="0" y="208" class="name">卡片盒</text>
    <text x="0" y="226" class="sub">目录清单 + 每份文件一张卡片</text>
  </g>

  <path d="M578 150 H618" stroke="#8b8471" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 4 回答员 -->
  <g transform="translate(628,86)">
    <rect x="0" y="8" width="92" height="72" rx="14" fill="#f7f3e6" stroke="#2b2b28" stroke-width="2"/>
    <circle cx="30" cy="40" r="5" fill="#1f1f1c"/>
    <circle cx="62" cy="40" r="5" fill="#1f1f1c"/>
    <path d="M34 56 q12 8 24 0" fill="none" stroke="#1f1f1c" stroke-width="2" stroke-linecap="round"/>
    <path d="M46 8 v-8 h-2" stroke="#2b2b28" stroke-width="2"/>
    <text x="46" y="102" class="name" text-anchor="middle">回答员</text>
    <text x="46" y="120" class="sub" text-anchor="middle">你用时才醒的 MCP 服务</text>
  </g>

  <path d="M726 150 H766" stroke="#8b8471" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 5 AI -->
  <g transform="translate(776,86)">
    <rect x="0" y="4" width="150" height="58" rx="3" fill="#fff" stroke="#cfc8b4"/>
    <path d="M24 62 l0 12 l14 -12 z" fill="#fff" stroke="#cfc8b4"/>
    <rect x="14" y="18" width="90" height="3" fill="#c9be9b"/>
    <rect x="14" y="27" width="118" height="3" fill="#ded7c3"/>
    <rect x="14" y="36" width="70" height="3" fill="#ded7c3"/>
    <text x="0" y="102" class="name">AI 助手</text>
    <text x="0" y="120" class="sub">拿着原话和页码回答你</text>
  </g>

  <!-- 返回箭头：AI 要改 -->
  <path d="M852 246 V318 H300 V306" fill="none" stroke="#a5651a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <g transform="translate(470,326)">
    <rect x="0" y="0" width="230" height="34" fill="#f7f3e6" stroke="#a5651a"/>
    <text x="12" y="22" font-size="12.5" fill="#a5651a">要改文件？先写申请单，你签字</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(24,374)">
    <circle cx="6" cy="-4" r="5" fill="none" stroke="#8b8471" stroke-dasharray="3 3"/>
    <text x="18" y="0" class="sub">虚线框 = 程序</text>
    <rect x="120" y="-10" width="14" height="12" fill="#f7f3e6" stroke="#1f1f1c" stroke-width="2"/>
    <text x="140" y="0" class="sub">粗黑框 = 盘上的文件</text>
    <rect x="286" y="-10" width="14" height="12" fill="#f7f3e6" stroke="#2b2b28"/>
    <text x="306" y="0" class="sub">普通框 = 原件 / 结果</text>
  </g>
</svg>
