<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8471"/>
    </marker>
    <style>
      .sub{font-size:11px;fill:#8b8471}
      .name{font-size:13.5px;font-weight:700;fill:#1f1f1c}
      .body{font-size:11.5px;fill:#2b2b28}
      .mono{font-size:9.5px;fill:#8b8471;letter-spacing:.12em}
    </style>
  </defs>

  <!-- 1 AI 起草 -->
  <g transform="translate(24,80)">
    <rect x="0" y="0" width="150" height="96" rx="3" fill="#fff" stroke="#cfc8b4"/>
    <path d="M26 84 h44 v6 h-44 z" fill="#f4f2e9" stroke="#cfc8b4"/>
    <rect x="16" y="18" width="90" height="4" fill="#c9be9b"/>
    <rect x="16" y="30" width="112" height="4" fill="#ded7c3"/>
    <rect x="16" y="42" width="70" height="4" fill="#ded7c3"/>
    <text x="16" y="66" class="mono" letter-spacing=".14em">AI</text>
    <text x="0" y="124" class="name">AI 说“要改”</text>
    <text x="0" y="142" class="sub">第 12 页那句改成六十日</text>
  </g>

  <path d="M186 128 H226" stroke="#8b8471" stroke-width="1.4" marker-end="url(#a3)"/>

  <!-- 2 申请单 -->
  <g transform="translate(238,58)">
    <rect x="0" y="0" width="200" height="140" fill="#fffdf7" stroke="#b9ad86"/>
    <rect x="0" y="0" width="200" height="22" fill="#efead9" stroke="#b9ad86"/>
    <text x="10" y="15" class="mono" letter-spacing=".14em">REVISION 清单</text>
    <g class="body">
      <text x="10" y="42">r1 · p.12:L3 替换</text>
      <text x="10" y="58" fill="#a5651a">原：三十日　→　新：六十日</text>
      <text x="10" y="74">理由：补充协议 2.2 已改</text>
      <text x="10" y="96">r2 · p.12:L9 追加</text>
      <text x="10" y="112" fill="#8b8471">待签字 · 状态 pending</text>
    </g>
    <text x="0" y="168" class="name">写一张申请单</text>
    <text x="0" y="186" class="sub">原句、新句、理由，一条一行；文件一字未动</text>
  </g>

  <path d="M452 128 H492" stroke="#8b8471" stroke-width="1.4" marker-end="url(#a3)"/>

  <!-- 3 人签字 -->
  <g transform="translate(504,66)">
    <rect x="0" y="0" width="170" height="124" fill="#f7f3e6" stroke="#a5651a" stroke-width="1.5"/>
    <g stroke="#a5651a" stroke-width="1.6" fill="none" opacity=".9">
      <circle cx="62" cy="46" r="30" stroke-dasharray="3 3"/>
      <path d="M44 46 q10 -14 20 0 q6 10 -4 12 q-14 3 -18 -6"/>
    </g>
    <text x="14" y="104" class="body" fill="#a5651a">你签字：--allow-apply</text>
    <text x="0" y="152" class="name">人来看一眼</text>
    <text x="0" y="170" class="sub">同意才开那个开关，否则只能提意见</text>
  </g>

  <path d="M684 128 H724" stroke="#8b8471" stroke-width="1.4" marker-end="url(#a3)"/>

  <!-- 4 动笔 + 留底 -->
  <g transform="translate(736,58)">
    <rect x="0" y="0" width="196" height="140" fill="#f7f3e6" stroke="#1f1f1c" stroke-width="2"/>
    <g transform="translate(14,14)">
      <rect x="0" y="0" width="86" height="100" fill="#fff" stroke="#cfc8b4"/>
      <rect x="10" y="20" width="62" height="3" fill="#ded7c3"/>
      <rect x="10" y="30" width="52" height="3" fill="#ded7c3"/>
      <rect x="10" y="42" width="66" height="9" fill="#cfe3d6" stroke="#1f4a3a"/>
      <rect x="10" y="60" width="58" height="3" fill="#ded7c3"/>
      <text x="0" y="116" class="mono">新稿</text>
    </g>
    <g transform="translate(108,14)">
      <rect x="0" y="0" width="74" height="100" fill="#efead9" stroke="#b9ad86"/>
      <path d="M8 24 h58 M8 36 h48 M8 48 h58" stroke="#c9be9b" stroke-dasharray="3 3"/>
      <text x="0" y="116" class="mono">旧稿备份</text>
    </g>
    <text x="0" y="168" class="name">动笔，并留底</text>
    <text x="0" y="186" class="sub">先存旧稿，只改那一行，卡片立刻重抄</text>
  </g>
</svg>
