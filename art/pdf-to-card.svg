<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8471"/>
    </marker>
    <style>
      .sub{font-size:11px;fill:#8b8471}
      .name{font-size:13.5px;font-weight:700;fill:#1f1f1c}
      .mono{font-size:10px;fill:#8b8471;letter-spacing:.12em}
      .body{font-size:12px;fill:#2b2b28}
    </style>
  </defs>

  <!-- 左：PDF 页面 -->
  <g transform="translate(24,72)">
    <rect x="0" y="0" width="150" height="196" fill="#fff" stroke="#b9ad86"/>
    <rect x="118" y="0" width="32" height="26" fill="#efe7d2"/>
    <path d="M118 26 L150 0" stroke="#b9ad86"/>
    <text x="12" y="24" class="mono" letter-spacing=".16em">第 12 页</text>
    <g fill="#c9be9b">
      <rect x="12" y="40" width="110" height="4"/>
      <rect x="12" y="52" width="96" height="4"/>
      <rect x="12" y="64" width="118" height="4"/>
      <rect x="12" y="76" width="70" height="4"/>
      <rect x="12" y="96" width="104" height="4"/>
      <rect x="12" y="108" width="122" height="4"/>
      <rect x="12" y="120" width="88" height="4"/>
      <rect x="12" y="140" width="112" height="4"/>
      <rect x="12" y="152" width="60" height="4"/>
    </g>
    <text x="0" y="216" class="name">一页 PDF</text>
    <text x="0" y="234" class="sub">人看着是排好的字</text>
  </g>

  <path d="M196 170 H236" stroke="#8b8471" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- 中：碎片 -->
  <g transform="translate(248,92)">
    <rect x="-10" y="-12" width="250" height="264" fill="none" stroke="#d6d1c2" stroke-dasharray="4 4"/>
    <g font-size="11" fill="#2b2b28">
      <g><rect x="0" y="0" width="134" height="24" fill="#fff" stroke="#cfc8b4"/><text x="7" y="16">12.3 甲方逾期付款的</text></g>
      <g><rect x="150" y="30" width="76" height="24" fill="#fff" stroke="#cfc8b4"/><text x="157" y="46">每逾期一日</text></g>
      <g><rect x="10" y="66" width="102" height="24" fill="#fff" stroke="#cfc8b4"/><text x="17" y="82">按逾期金额的</text></g>
      <g><rect x="136" y="96" width="70" height="24" fill="#fff" stroke="#cfc8b4"/><text x="143" y="112">万分之五</text></g>
      <g><rect x="0" y="132" width="140" height="24" fill="#fff" stroke="#cfc8b4"/><text x="7" y="148">向乙方支付违约金</text></g>
      <g><rect x="154" y="160" width="56" height="24" fill="#fff" stroke="#cfc8b4"/><text x="161" y="176">×=72</text></g>
    </g>
    <text x="115" y="222" class="name" text-anchor="middle">机器读到的样子</text>
    <text x="115" y="242" class="sub" text-anchor="middle">位置乱、顺序乱、断成小块</text>
  </g>

  <path d="M516 170 H556" stroke="#8b8471" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- 右：卡片 -->
  <g transform="translate(568,72)">
    <rect x="0" y="0" width="368" height="196" fill="#f7f3e6" stroke="#1f1f1c" stroke-width="2"/>
    <g transform="translate(16,18)">
      <rect x="0" y="0" width="46" height="18" fill="#0d2a24"/>
      <text x="8" y="13" font-size="10.5" fill="#cfe3d6" font-family="ui-monospace,monospace">p.12</text>
      <text x="58" y="14" class="body">12.3 甲方逾期付款的，每逾期一日</text>
    </g>
    <g transform="translate(16,46)">
      <rect x="0" y="0" width="46" height="18" fill="#0d2a24"/>
      <text x="8" y="13" font-size="10.5" fill="#cfe3d6" font-family="ui-monospace,monospace">p.12</text>
      <text x="58" y="14" class="body">按逾期金额的万分之五向乙方支付</text>
    </g>
    <g transform="translate(16,74)">
      <rect x="0" y="0" width="46" height="18" fill="#0d2a24"/>
      <text x="8" y="13" font-size="10.5" fill="#cfe3d6" font-family="ui-monospace,monospace">p.12</text>
      <text x="58" y="14" class="body">违约金</text>
    </g>
    <g transform="translate(16,102)">
      <rect x="0" y="0" width="46" height="18" fill="#0d2a24"/>
      <text x="8" y="13" font-size="10.5" fill="#cfe3d6" font-family="ui-monospace,monospace">p.12</text>
      <text x="58" y="14" class="body">12.4 乙方逾期提交发票的，每逾期</text>
    </g>
    <g transform="translate(16,130)">
      <rect x="0" y="0" width="46" height="18" fill="#0d2a24"/>
      <text x="8" y="13" font-size="10.5" fill="#cfe3d6" font-family="ui-monospace,monospace">p.15</text>
      <text x="58" y="14" class="body">14.2 乙方逾期交付的，每逾期一日</text>
    </g>
    <text x="0" y="216" class="name">一份卡片</text>
    <text x="0" y="234" class="sub">一行一句，左边永远是页码</text>
  </g>

  <text x="24" y="356" class="sub">同一高度 ⇒ 拼成一行　　空隙大 ⇒ 补三个空格　　落在哪页 ⇒ 记在行首</text>
  <text x="24" y="380" class="sub">搜的时候只翻卡片，翻到哪行就把那一行连同页码交给 AI —— 它不用读完整份文件。</text>
</svg>
